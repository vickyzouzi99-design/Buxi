server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  client_max_body_size 16k;
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host api;
    proxy_read_timeout 60s;
  }
  location /health/ {
    proxy_pass http://api:8000;
    proxy_set_header Host api;
  }
  location / { try_files $uri $uri/ /index.html; }
}
