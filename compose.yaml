services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file: .env
    environment:
      BUXI_DATA_DIR: /data
    volumes:
      - buxi-data:/data
    restart: unless-stopped
  web:
    build:
      context: ./web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  buxi-data:
